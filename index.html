<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JETRIS</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<script type="module">
    import {newGame, pause, mute} from './game.js'
    window.pause = pause;
    window.newGame = newGame;
    window.mute = mute;
</script>

<body id="body">
    <audio autoplay loop>
        <source src="sounds/bgmusic.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>
    <main class="cabinet">

        <!-- left column: title, stats, controls -->
        <aside class="col-side">
            <header class="header">
                <div>
                    <h1 class="title">JETRIS</h1>
                    <p class="subtitle">insert coin</p>
                </div>
            </header>

            <section class="panel panel-score">
                <span class="panel-title">Score</span>
                <input class="readout" type="text" id="score" disabled="disabled" />
            </section>

            <section class="stat-group">
                <section class="panel stat">
                    <span class="stat-label">Lines</span>
                    <input class="readout" type="text" id="lines" disabled="disabled" />
                </section>
                <section class="panel stat">
                    <span class="stat-label">Level</span>
                    <input class="readout" type="text" id="level" disabled="disabled" />
                </section>
            </section>

            <section class="panel panel-next">
                <span class="panel-title">Next</span>
                <div class="next-wrap"><img id="next" /></div>
            </section>

            <nav class="controls">
                <button class="btn" title="New Game" onclick="newGame(this)">
                    <span class="material-symbols-outlined">stadia_controller</span>
                </button>
                <button class="btn" title="Play/Pause" onclick="pause(this)">
                    <span id="pause_icon" class="material-symbols-outlined">pause</span>
                </button>
                <button class="btn" title="Mute" onclick="mute(this);">
                    <span id="mute_icon" class="material-symbols-outlined">volume_up</span>
                </button>
            </nav>

            <div class="keys">
                <span><b class="k">&#8592;</b><b class="k">&#8594;</b> move</span>
                <span><b class="k">&#8595;</b> soft drop</span>
                <span><b class="k">&#8593;</b> rotate</span>
                <span><b class="k">Space</b> hard drop</span>
            </div>
        </aside>

        <!-- center: the game screen -->
        <section class="col-main">
            <div class="screen">
                <canvas id="jetris" width="204" height="404"></canvas>
            </div>
        </section>

        <!-- right: piece history stats -->
        <aside class="col-stats">
            <div class="panel panel-stats">
                <span class="panel-title">History</span>
                <div id="stats" class="stats"></div>
            </div>
        </aside>

    </main>
</body>

</html>
